[package]
name = "taskboard-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
http-body-util = "0.1"
rand = "0.8"
rtn-mq = { path = "../../rtn-mq" }
taskboard-wire = { path = "../wire" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
serde_json = "1"
taskboard = { path = "../backend" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
