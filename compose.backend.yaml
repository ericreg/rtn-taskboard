services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      additional_contexts:
        rtn_mq: ../rtn-mq
    image: taskboard-backend:local
    network_mode: host
    environment:
      TASKBOARD_BASE_URL: ${TASKBOARD_BASE_URL:-http://localhost:8080}
      TASKBOARD_SECURE_COOKIES: ${TASKBOARD_SECURE_COOKIES:-false}
      TASKBOARD_MAX_DB_GIB: ${TASKBOARD_MAX_DB_GIB:-0}
      TASKBOARD_MAX_IMAGE_MIB: ${TASKBOARD_MAX_IMAGE_MIB:-10}
      TASKBOARD_DISCORD_TOKEN: ${TASKBOARD_DISCORD_TOKEN:-}
      TASKBOARD_DISCORD_GUILD_ID: ${TASKBOARD_DISCORD_GUILD_ID:-}
      TASKBOARD_DATABASE: /data/taskboard.db
      TASKBOARD_RTN_IDENTITY: /data/rtn/backend.key
      TASKBOARD_RTN_STATE: /data/rtn/backend.cbor
      TASKBOARD_RTN_RELAY_ONLY: ${TASKBOARD_RTN_RELAY_ONLY:-true}
      RUST_LOG: ${RUST_LOG:-taskboard=info,tower_http=info}
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
