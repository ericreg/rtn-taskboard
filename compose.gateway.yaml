services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        TASKBOARD_UID: ${TASKBOARD_UID:?Run through just or export TASKBOARD_UID from id -u}
        TASKBOARD_GID: ${TASKBOARD_GID:?Run through just or export TASKBOARD_GID from id -g}
      additional_contexts:
        rtn_mq: ../rtn-mq
    image: taskboard-gateway:local
    user: "${TASKBOARD_UID:?Set TASKBOARD_UID}:${TASKBOARD_GID:?Set TASKBOARD_GID}"
    network_mode: host
    environment:
      TASKBOARD_RTN_JOIN_CODE: ${TASKBOARD_RTN_JOIN_CODE:-}
      TASKBOARD_FRONTEND: /www
      TASKBOARD_GATEWAY_BIND: "${TASKBOARD_PUBLISH_ADDRESS:-127.0.0.1}:8080"
      TASKBOARD_GATEWAY_ORIGIN: ${TASKBOARD_GATEWAY_ORIGIN:-http://localhost:8080}
      TASKBOARD_RTN_IDENTITY: /data/rtn/gateway.key
      TASKBOARD_RTN_RELAY_ONLY: ${TASKBOARD_RTN_RELAY_ONLY:-true}
      RUST_LOG: ${RUST_LOG:-taskboard_gateway=info,tower_http=info,rtn_mq=info,iroh=warn,iroh_relay=warn}
    volumes:
      - taskboard-gateway-data:/data
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  taskboard-gateway-data:
